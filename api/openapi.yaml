          allOf:
            - $ref: '#/components/schemas/SolanaAddress'
          description: Kunci unik untuk menemukan transaksi order ini.
        solana_pay_url:
          type: string
          maxLength: 2048
          description: Isi QR, dengan bentuk `solana:https://<host>/api/v1/solana-pay/orders/<order_id>`.
          pattern: '^solana:https://'
        payer_wallet:
          description: Terisi setelah transaksi ditemukan, dan menjadi tujuan refund.
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        signature:
          oneOf:
            - $ref: '#/components/schemas/TransactionSignature'
            - type: 'null'
        explorer_url:
          oneOf:
            - $ref: '#/components/schemas/ExplorerUrl'
            - type: 'null'
