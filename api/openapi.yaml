      description: |
        `awaiting_signature` berarti menunggu persetujuan di wallet toko. `confirming` berarti signature
        sudah diterima dan sedang divalidasi. `completed` berarti pembeli sudah menerima dana dan potongan
        tercatat. `failed` dan `expired` tidak mengubah saldo maupun catatan.
