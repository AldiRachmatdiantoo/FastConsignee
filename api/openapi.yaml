          $ref: '#/components/schemas/Uuid'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        discount:
          $ref: '#/components/schemas/LineDiscount'
    CartRequest:
      type: object
      additionalProperties: false
      required: [lines]
      description: Satu `item_id` hanya boleh muncul sekali. Keranjang memuat paling banyak 5 penitip.
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartLine'
    Rate:
      type: object
      required: [idr_per_sol, quoted_at]
      properties:
        idr_per_sol:
          type: integer
          maximum: 1000000000000
          format: int64
          minimum: 1
          description: Harga 1 SOL dalam Rupiah.
        quoted_at:
          $ref: '#/components/schemas/Timestamp'
    PreviewLine:
      type: object
      required:
        - item_id
        - item_name
        - consignor
        - quantity
        - unit_price_idr
        - commission_bps
        - discount
        - line_total_idr
        - commission_idr
        - consignor_share_idr
      properties:
        item_id:
          $ref: '#/components/schemas/Uuid'
        item_name:
          type: string
          maxLength: 200
        consignor:
          $ref: '#/components/schemas/ConsignorRef'
        quantity:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
        unit_price_idr:
          $ref: '#/components/schemas/AmountIdr'
        commission_bps:
          $ref: '#/components/schemas/CommissionBps'
        discount:
          oneOf:
            - $ref: '#/components/schemas/LineDiscount'
            - type: 'null'
        line_total_idr:
          $ref: '#/components/schemas/AmountIdr'
        commission_idr:
          $ref: '#/components/schemas/AmountIdr'
        consignor_share_idr:
          $ref: '#/components/schemas/AmountIdr'
    SplitRecipient:
      type: object
      required:
        - recipient_type
        - consignor_id
        - name
        - wallet_address
        - share_idr
        - deduction_idr
        - recovered_idr
        - amount_idr
        - amount_lamports
      description: |
        Satu baris per penerima. `amount_idr` = `share_idr` - `deduction_idr` + `recovered_idr`. Penerima
        dengan `amount_lamports` 0 tetap tampil, tetapi tidak mendapat transfer.
      properties:
        recipient_type:
          type: string
          enum: [store, consignor]
        consignor_id:
          description: Bernilai `null` untuk toko.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        name:
          type: string
          maxLength: 200
        wallet_address:
          $ref: '#/components/schemas/SolanaAddress'
        share_idr:
          $ref: '#/components/schemas/AmountIdr'
        deduction_idr:
          allOf:
            - $ref: '#/components/schemas/AmountIdr'
          description: Potongan refund yang diambil dari penitip di order ini. Selalu 0 untuk toko.
        recovered_idr:
          allOf:
            - $ref: '#/components/schemas/AmountIdr'
          description: Dana talangan yang kembali ke toko di order ini. Selalu 0 untuk penitip.
        amount_idr:
          $ref: '#/components/schemas/AmountIdr'
        amount_lamports:
          $ref: '#/components/schemas/AmountLamports'
    OrderPreview:
      type: object
      required:
        - subtotal_idr
        - discount_idr
        - total_idr
        - total_lamports
        - rate
        - lines
        - recipients
      description: Jumlah `recipients.amount_idr` sama dengan `total_idr`, dan jumlah lamport sama dengan `total_lamports`.
      properties:
        subtotal_idr:
          $ref: '#/components/schemas/AmountIdr'
        discount_idr:
          $ref: '#/components/schemas/AmountIdr'
        total_idr:
          $ref: '#/components/schemas/AmountIdr'
        total_lamports:
          $ref: '#/components/schemas/AmountLamports'
        rate:
          $ref: '#/components/schemas/Rate'
        lines:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PreviewLine'
        recipients:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/SplitRecipient'

    OrderStatus:
      type: string
      enum: [pending, confirmed, expired, failed]
      description: |
        `pending` berarti menunggu pembayaran. `confirmed` berarti transaksi tervalidasi dan stok terpotong.
        `expired` berarti batas waktu lewat. `failed` berarti transaksi gagal atau tidak cocok dengan order.
    FailureCode:
      type: string
      enum: [TRANSACTION_FAILED, VALIDATION_MISMATCH]
    CertificateMetadata:
      type: object
      additionalProperties: false
      required: [name, symbol, description, image, attributes]
      properties:
        name:
          type: string
          maxLength: 32
        symbol:
          type: string
          maxLength: 10
        description:
          type: string
          maxLength: 500
        image:
          type: string
          format: uri
          maxLength: 2048
        attributes:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [trait_type, value]
            properties:
              trait_type:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 500
    CertificateStatus:
      type: string
      enum: [pending, sent, failed]
    Certificate:
      type: object
      required: [status, mint_address, explorer_url]
      properties:
        status:
          $ref: '#/components/schemas/CertificateStatus'
        mint_address:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        explorer_url:
          oneOf:
            - $ref: '#/components/schemas/ExplorerUrl'
            - type: 'null'
    OrderLine:
      allOf:
        - $ref: '#/components/schemas/PreviewLine'
