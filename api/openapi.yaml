            $ref: '#/components/schemas/DeductionStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Daftar potongan dan total yang belum lunas.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeductionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard/consignor/stock:
    get:
      operationId: listConsignorStock
      tags: [Dashboard]
      summary: Membaca sisa stok penitip
      description: Nilainya sama dengan `stock_available` di katalog kasir.
      x-fr: [FR-20]
      x-priority: Kalau sempat
      x-roles: [consignor]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Daftar stok.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignorStockList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard/store/summary:
    get:
      operationId: getStoreSummary
      tags: [Dashboard]
      summary: Membaca ringkasan toko
      description: |
        Hanya menghitung order `confirmed`, dan bisa di-cache sekitar 30 detik. Tautan Explorer tiap
        transaksi ada di `GET /api/v1/orders`.
      x-fr: [FR-19]
      x-priority: Sebaiknya
      x-roles: [store_owner]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Ringkasan penjualan.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT yang diterbitkan Supabase Auth. Verifikasinya mengikuti RFC8725, yaitu algoritma dibatasi, dan `exp`, `iss`, serta `aud` selalu diperiksa.

  parameters:
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConsignorId:
      name: consignor_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderId:
      name: order_id
      in: path
      required: true
      description: UUIDv4 yang tidak bisa ditebak.
      schema:
        $ref: '#/components/schemas/Uuid'
    CertificateId:
      name: certificate_id
      in: path
      required: true
      description: UUIDv4 sertifikat.
      schema:
        $ref: '#/components/schemas/Uuid'
    RefundId:
      name: refund_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Nilai `next_cursor` dari halaman sebelumnya.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        maxLength: 512
    From:
      name: from
      in: query
      description: Awal periode, inklusif.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      description: Akhir periode, eksklusif.
      schema:
        $ref: '#/components/schemas/Timestamp'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Kunci unik per percobaan, disarankan UUID.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]+$'
        minLength: 8
        maxLength: 128

  headers:
    IdempotencyReplayed:
      description: Bernilai `true` kalau jawaban ini hasil permintaan sebelumnya.
      schema:
        type: boolean
    RetryAfter:
      description: Jumlah detik sebelum boleh mencoba lagi.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 3600
    RateLimitLimit:
      description: Batas permintaan dalam satu jendela waktu.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100000
    RateLimitRemaining:
      description: Sisa permintaan dalam jendela waktu ini.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
    RateLimitReset:
      description: Jumlah detik sampai jendela waktu berikutnya.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 3600
    WwwAuthenticate:
      description: Skema autentikasi yang diterima.
      schema:
        type: string
        maxLength: 200
    Location:
      description: URL resource yang baru dibuat.
      schema:
        type: string
        format: uri-reference
        maxLength: 2048

  responses:
    BadRequest:
      description: Format permintaan tidak valid. Kodenya `VALIDATION_FAILED`.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: JWT tidak ada, tidak valid, atau kedaluwarsa. Kodenya `UNAUTHENTICATED`.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Kodenya `FORBIDDEN`, `ROLE_NOT_ASSIGNED`, atau `WALLET_NOT_LINKED`.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Data tidak ditemukan atau bukan milik toko ini. Kodenya `NOT_FOUND`.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Permintaan bertabrakan dengan kondisi data. Lihat `x-error-codes` di operasinya.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientStock:
              summary: Stok tidak cukup
              value:
                type: about:blank
                title: Stok tidak cukup
                status: 409
                detail: Stok beberapa barang tidak cukup.
                code: INSUFFICIENT_STOCK
                request_id: 0b6f4f0e-6f5a-4a39-9d42-3f7c1f3a5a11
                details:
                  items:
                    - item_id: 22222222-2222-4222-8222-222222222222
                      requested: 2
                      available: 1
    UnprocessableEntity:
      description: Format benar, tetapi aturan bisnis menolaknya. Lihat `x-error-codes` di operasinya.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            belowRentMinimum:
              summary: Transfer ke wallet kosong di bawah minimum rent
              value:
                type: about:blank
                title: Di bawah minimum rent
                status: 422
                detail: Bagian penerima terlalu kecil untuk wallet yang masih kosong.
                code: BELOW_RENT_MINIMUM
                request_id: 7d1c2a90-52de-4f3e-8a11-0c9e5b7c2e44
                details:
                  wallet_address: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
                  amount_lamports: '500000'
                  minimum_lamports: '890880'
    TooManyRequests:
      description: Rate limit terlampaui. Kodenya `RATE_LIMITED`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Kesalahan server. Kodenya `INTERNAL_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependensi tidak tersedia. Kodenya `SERVICE_UNAVAILABLE` atau `RATE_UNAVAILABLE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SolanaPayBadRequest:
      description: ID order atau alamat `account` tidak valid.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaPayError'
    SolanaPayNotFound:
      description: Order tidak ditemukan.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaPayError'
    SolanaPayConflict:
      description: Order sudah `confirmed` atau `failed`.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaPayError'
    SolanaPayGone:
      description: Order sudah kedaluwarsa.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaPayError'
    SolanaPayTooManyRequests:
      description: Rate limit per IP atau per order terlampaui.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaPayError'
    SolanaPayServerError:
      description: Kesalahan server atau RPC Solana tidak tersedia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SolanaPayError'

  schemas:
    Uuid:
      type: string
      maxLength: 36
      format: uuid
    Timestamp:
      type: string
      maxLength: 35
      format: date-time
      description: Waktu RFC 3339 dalam UTC.
    SolanaAddress:
      type: string
      maxLength: 44
      description: Public key Solana dalam base58.
      pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
    TransactionSignature:
      type: string
      maxLength: 88
      description: Signature Solana dalam base58.
      pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$'
    AmountIdr:
      type: integer
      maximum: 1000000000000000
      format: int64
      minimum: 0
      description: Nilai Rupiah sebagai bilangan bulat.
    AmountLamports:
      type: string
      maxLength: 20
      description: Nilai lamport sebagai string angka.
      pattern: '^[0-9]+$'
    CommissionBps:
      type: integer
      format: int32
      minimum: 0
      maximum: 10000
      description: Komisi toko dalam basis point. 2000 berarti 20%.
    ExplorerUrl:
      type: string
      maxLength: 2048
      format: uri
      description: Tautan Solana Explorer ke cluster Devnet.
    NextCursor:
      type:
        - string
        - 'null'
      maxLength: 512
      description: Bernilai `null` kalau tidak ada halaman berikutnya.
    Role:
      type: string
      enum: [cashier, store_owner, consignor]
    Network:
      type: string
      enum: [devnet]
      description: Aplikasi hanya berjalan di Devnet.

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      required: [type, title, status, code, request_id]
      description: Detail masalah menurut RFC 9457, dengan tambahan `code` dan `request_id`.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          maxLength: 2048
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
          description: Pesan untuk manusia. Klien tidak boleh mengambil keputusan dari teks ini.
        instance:
          type: string
          format: uri-reference
          maxLength: 2048
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
          maxLength: 64
          description: ID untuk mencari log server.
        errors:
          type: array
          maxItems: 100
          description: Kesalahan per kolom untuk `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          description: Data tambahan, misalnya barang yang stoknya kurang.
          additionalProperties: true
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 500
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - ROLE_NOT_ASSIGNED
        - WALLET_NOT_LINKED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - NONCE_INVALID
        - SIGNATURE_INVALID
        - WALLET_ALREADY_LINKED
        - STOCK_BELOW_RESERVED
        - CONSIGNOR_EMAIL_TAKEN
        - IDEMPOTENCY_KEY_REUSED
        - INSUFFICIENT_STOCK
        - TOO_MANY_CONSIGNORS
        - DISCOUNT_TOO_LARGE
        - RECIPIENT_WALLET_MISSING
        - STORE_WALLET_NOT_LINKED
        - BELOW_RENT_MINIMUM
        - RATE_UNAVAILABLE
        - ORDER_NOT_REFUNDABLE
        - ALREADY_REFUNDED
        - REFUND_IN_PROGRESS
        - REFUND_NOT_AWAITING_SIGNATURE
    SolanaPayError:
      type: object
      required: [message]
      description: Spesifikasi Solana Pay tidak mengatur isi error, dan bentuk ini menjadi ketetapan API.
      properties:
        message:
          type: string
          maxLength: 500

    Me:
      type: object
      required: [id, email, name, role, store, consignor_id, wallet, wallet_required]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          maxLength: 254
          format: email
        name:
          type: string
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        store:
          $ref: '#/components/schemas/StoreRef'
        consignor_id:
          description: Terisi hanya untuk peran `consignor`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        wallet:
          description: Wallet tertaut yang sudah terbukti. Wallet `unverified` tampil sebagai `null`.
          oneOf:
            - $ref: '#/components/schemas/WalletLink'
            - type: 'null'
        wallet_required:
          type: boolean
          description: True untuk `store_owner` dan `consignor`.
    StoreRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 200
    WalletNonceRequest:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          $ref: '#/components/schemas/SolanaAddress'
    WalletNonce:
      type: object
      required: [nonce, message, expires_at]
      properties:
        nonce:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9]+$'
        message:
          type: string
          maxLength: 500
          description: Teks yang harus ditandatangani apa adanya, memuat domain, alamat, dan nonce.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    WalletLinkRequest:
      type: object
      additionalProperties: false
      required: [address, nonce, signature]
      properties:
        address:
          $ref: '#/components/schemas/SolanaAddress'
        nonce:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9]+$'
        signature:
          type: string
          maxLength: 88
          description: Tanda tangan ed25519 atas `message`, dalam base58.
          pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$'
    WalletLink:
      type: object
      required: [address, linked_at]
      properties:
        address:
          $ref: '#/components/schemas/SolanaAddress'
        linked_at:
          $ref: '#/components/schemas/Timestamp'

    ConsignorRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 200
    Item:
      type: object
      required:
        - id
        - name
        - price_idr
        - commission_bps
        - consignor
        - stock_on_hand
        - stock_reserved
        - stock_available
        - active
        - certificate_enabled
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 200
        price_idr:
          $ref: '#/components/schemas/AmountIdr'
        commission_bps:
          $ref: '#/components/schemas/CommissionBps'
        consignor:
          $ref: '#/components/schemas/ConsignorRef'
        stock_on_hand:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
          description: Stok fisik di toko.
        stock_reserved:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
          description: Stok yang tertahan order `pending`.
        stock_available:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
          description: Sama dengan `stock_on_hand` dikurangi `stock_reserved`.
        active:
          type: boolean
        certificate_enabled:
          type: boolean
          description: True kalau penjualan barang ini menerbitkan NFT sertifikat keaslian.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ItemCreate:
      type: object
      additionalProperties: false
      required: [name, price_idr, commission_bps, consignor_id, stock_on_hand]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        price_idr:
          type: integer
          maximum: 10000000000
          format: int64
          minimum: 1
        commission_bps:
          $ref: '#/components/schemas/CommissionBps'
        consignor_id:
          $ref: '#/components/schemas/Uuid'
        stock_on_hand:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
        certificate_enabled:
          type: boolean
          default: false
    ItemUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        price_idr:
          type: integer
          maximum: 10000000000
          format: int64
          minimum: 1
        commission_bps:
          $ref: '#/components/schemas/CommissionBps'
        stock_on_hand:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
        active:
          type: boolean
        certificate_enabled:
          type: boolean
    ItemList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Item'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    WalletStatus:
      type: string
      enum: [unlinked, unverified, verified]
      description: |
        `unlinked` berarti belum ada alamat, dan order yang memuat barangnya ditolak. `unverified` berarti
        alamat didaftarkan pemilik toko dan sudah bisa menerima pembayaran. `verified` berarti penitip
        sudah menandatanganinya.
    Consignor:
      type: object
      required: [id, name, email, wallet_address, wallet_status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 254
          format: email
        wallet_address:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        wallet_status:
          $ref: '#/components/schemas/WalletStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
