openapi: 3.1.0
info:
  title: FastConsignee API
  version: 0.1.0
  summary: Kontrak API kasir konsinyasi dengan pembagian dana dalam satu transaksi Solana.
  contact:
    name: FastConsignee
    url: https://github.com/AldiRachmatdiantoo/FastConsignee
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Kontrak ini mengikat frontend Next.js dan backend Go. Semua fitur di PRD tercakup di sini,
    termasuk yang berprioritas Sebaiknya dan Kalau sempat. Tiap operasi mencatat kebutuhannya di
    `x-fr`, prioritasnya di `x-priority`, peran yang boleh memanggilnya di `x-roles`, dan kode
    error khususnya di `x-error-codes`.

    ## Autentikasi dan peran
    Login memakai Google lewat Supabase Auth langsung dari frontend, jadi API tidak punya endpoint
    login. Frontend mengirim JWT Supabase di header `Authorization: Bearer <token>`, dan API
    memverifikasinya. JWT membuktikan identitas, lalu peran dibaca dari akun di database, sehingga
    pencabutan peran langsung berlaku tanpa menunggu JWT kedaluwarsa. Akun yang belum terdaftar di toko
    menerima `403 ROLE_NOT_ASSIGNED`.

    | Peran | Nilai | Akses |
    | --- | --- | --- |
    | Kasir | `cashier` | Katalog, membuat order, order yang dibuatnya sendiri |
    | Pemilik toko | `store_owner` | Semua data toko, termasuk refund, barang, dan penitip |
    | Penitip | `consignor` | Dasbor miliknya sendiri |

    Pembeli tidak login. Endpoint `public` dan `solana-pay` terbuka, dan keamanannya bergantung pada
    ID order UUIDv4 yang tidak bisa ditebak.

    Pemilik toko dan penitip yang belum menautkan wallet hanya boleh memanggil `GET /api/v1/me` dan
    `/api/v1/wallet/*`. Semua endpoint lain menjawab `403 WALLET_NOT_LINKED`.

    ## Uang
    - Harga dan bagian dihitung dalam Rupiah sebagai bilangan bulat, dengan akhiran `_idr`.
    - Nilai SOL memakai lamport (1 SOL = 1.000.000.000 lamport), dengan akhiran `_lamports`. Nilainya
      dikirim sebagai string supaya tidak kehilangan presisi di JavaScript.
    - Komisi memakai basis point, dengan akhiran `_bps` (2000 berarti 20%).
    - Browser hanya mengirim `item_id`, jumlah, dan diskon. Harga, bagian, dan penerima selalu dihitung
      server.

    Urutan perhitungan pembagian:
    1. `line_total_idr` = harga x jumlah, dikurangi diskon baris.
    2. Bagian penitip = pembulatan ke bawah dari harga x jumlah x (10000 - `commission_bps`) / 10000.
       Komisi toko adalah sisanya, jadi sisa pembulatan Rupiah masuk ke toko.
    3. Diskon diserap seluruhnya oleh pihak yang menanggungnya. Diskon tidak boleh melebihi bagian
       pihak itu pada baris tersebut.
    4. Bagian digabung per penerima. Potongan refund yang belum lunas dikurangkan dari penitip dan
       ditambahkan ke toko.
    5. `total_lamports` = pembulatan ke atas dari `total_idr` x 1.000.000.000 / `idr_per_sol`.
    6. Lamport tiap penitip = pembulatan ke bawah dari `amount_idr` x 1.000.000.000 / `idr_per_sol`.
       Toko menerima sisanya, jadi jumlah semua penerima selalu sama dengan `total_lamports`.

    ## Status real-time
    Status memakai polling, bukan WebSocket atau SSE, supaya API tetap stateless dan JWT tetap di
    header. Klien memanggil endpoint status tiap 2 detik selama order masih `pending`. Status tidak
    pernah di-cache.

    Status `confirmed`, `expired`, dan `failed` bersifat final. Mencoba lagi berarti membuat order baru
    dengan `Idempotency-Key` baru. Keranjang disimpan di klien, jadi tidak ada resource keranjang di
    server.

    QR berlaku 5 menit. Setelah `expires_at`, server berhenti menyusun transaksi, tetapi order tetap
    `pending` dan stoknya tetap tertahan selama masa tenggang 2 menit. Masa ini mencakup transaksi yang
    sudah terkirim sesaat sebelum batas waktu, supaya dana yang sudah terbagi tidak bertemu stok yang
    sudah dilepas. Durasi keduanya diatur konfigurasi server.

    ## Idempotency
    `POST /api/v1/orders` dan `POST /api/v1/orders/{order_id}/refunds` wajib memakai header
    `Idempotency-Key`. Kunci yang sama dengan isi yang sama mengembalikan hasil pertama dan header
    `Idempotency-Replayed: true`. Kunci yang sama dengan isi berbeda menjawab
    `409 IDEMPOTENCY_KEY_REUSED`.

    ## Error
    Semua error mengikuti RFC 9457 dengan media type `application/problem+json`, kecuali endpoint
    `solana-pay` yang memakai `SolanaPayError` karena dibaca wallet. Klien mengambil keputusan dari
    `code`, bukan dari `title` atau `detail`. Kesalahan per kolom ada di `errors`.

    Metode yang tidak terdaftar di alamat yang ada menjawab `405 METHOD_NOT_ALLOWED` dengan header
    `Allow`. Alamat yang tidak ada menjawab `404 NOT_FOUND`.

    Tiap jawaban memuat header `X-Request-Id`, yang nilainya sama dengan `request_id` pada error.

    ## Pagination
    Daftar memakai cursor: kirim `next_cursor` sebagai `cursor`, dan `null` berarti data sudah habis.

    ## Rate limit
    Endpoint yang butuh login dibatasi per akun, sedangkan endpoint `public` dan `solana-pay` dibatasi
    per IP dan per order. `/healthz` dikecualikan. Batas bawaannya 120 permintaan per menit per akun,
    60 per menit per IP, dan 30 per menit per order, jadi polling 2 detik masih aman. Jawaban `429`
    memuat `Retry-After` dan header `RateLimit-*`.

    ## CORS
    Endpoint `solana-pay` dipanggil wallet dari origin apa pun, jadi harus menjawab preflight `OPTIONS`
    dan mengirim `Access-Control-Allow-Origin: *`. Endpoint lain hanya menerima origin frontend.
  x-requirements-without-endpoint:
    FR-21: Seed data dimuat lewat migrasi atau skrip seed, bukan lewat API.
servers:
  - url: http://localhost:8080
    description: Lokal. URL produksi ditetapkan setelah deploy ke Render.
    x-internal: true
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Health check untuk cron dan load balancer.
  - name: Auth
    description: Profil pengguna dan penautan wallet.
  - name: Items
    description: Katalog dan pengaturan barang.
  - name: Consignors
    description: Pendaftaran penitip oleh pemilik toko.
  - name: Orders
    description: Rincian pembagian, pembuatan order, dan riwayat.
  - name: Payment
    description: Layar bayar pembeli dan Solana Pay Transaction Request.
  - name: Refunds
    description: Refund satu barang dari wallet toko ke wallet pembayar.
  - name: Dashboard
    description: Dasbor penitip dan pemilik toko.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Memeriksa API hidup
      description: Dipanggil cron eksternal dan load balancer. Tidak terkena rate limit.
      security: []
      x-nfr: [NFR-23]
      x-priority: Wajib
      x-roles: [public]
      responses:
        '200':
          description: API hidup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Membaca profil pengguna yang login
      description: |
        Frontend memanggil ini setelah login untuk menentukan layar berikutnya. Kalau
        `wallet_required` bernilai true dan `wallet` bernilai null, frontend membuka penautan wallet.
      x-fr: [FR-25, FR-26]
      x-priority: Wajib
      x-roles: [cashier, store_owner, consignor]
      x-error-codes: [ROLE_NOT_ASSIGNED]
      responses:
        '200':
          description: Profil pengguna.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wallet/nonce:
    post:
      operationId: createWalletNonce
      tags: [Auth]
      summary: Meminta pesan untuk ditandatangani
      description: |
        Membuat nonce sekali pakai untuk alamat wallet. Klien menandatangani `message` apa adanya
        dengan wallet tersebut. Menandatangani pesan tidak memakai saldo dan tidak mengirim transaksi.
      x-fr: [FR-27]
      x-priority: Wajib
      x-roles: [store_owner, consignor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletNonceRequest'
      responses:
        '201':
          description: Nonce dibuat.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletNonce'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wallet/link:
    post:
      operationId: linkWallet
      tags: [Auth]
      summary: Menautkan wallet dengan tanda tangan
      description: |
        Memverifikasi tanda tangan, lalu menautkan wallet ke toko untuk `store_owner` atau ke penitip
        untuk `consignor`. Pemanggilan ulang dengan wallet lain mengganti wallet tertaut, dan order
        yang sudah dibuat tetap memakai wallet lama.
      x-fr: [FR-27]
      x-priority: Wajib
      x-roles: [store_owner, consignor]
      x-error-codes: [NONCE_INVALID, SIGNATURE_INVALID, WALLET_ALREADY_LINKED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLinkRequest'
      responses:
        '200':
          description: Wallet tertaut.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/items:
    get:
      operationId: listItems
      tags: [Items]
      summary: Membaca katalog barang
      description: Barang dengan `stock_available` 0 tetap tampil, tetapi tidak bisa dipilih kasir.
      x-fr: [FR-01, FR-02]
      x-priority: Wajib
      x-roles: [cashier, store_owner]
      parameters:
        - name: q
          in: query
          description: Mencari nama barang.
          schema:
            type: string
            maxLength: 100
        - name: consignor_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: active
          in: query
          description: Bawaannya hanya barang aktif.
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Daftar barang.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createItem
      tags: [Items]
      summary: Menambah barang
      description: Barang baru langsung aktif dan masuk katalog. Penitipnya harus berasal dari toko yang sama.
      x-fr: [FR-22]
      x-priority: Kalau sempat
      x-roles: [store_owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Barang dibuat.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/items/{item_id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: getItem
      tags: [Items]
      summary: Membaca satu barang
      description: Memuat stok fisik, stok tertahan, dan stok yang bisa dijual.
      x-fr: [FR-01]
      x-priority: Wajib
      x-roles: [cashier, store_owner]
      responses:
        '200':
          description: Data barang.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateItem
      tags: [Items]
      summary: Mengubah barang
      description: |
        Perubahan harga dan komisi berlaku untuk penjualan berikutnya, karena order menyimpan salinan
        nilainya. Barang tidak dihapus supaya riwayat tetap utuh, jadi kirim `active: false` untuk
        menariknya dari katalog.
      x-fr: [FR-22]
      x-priority: Kalau sempat
      x-roles: [store_owner]
      x-error-codes: [STOCK_BELOW_RESERVED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: Barang diubah.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/consignors:
    get:
      operationId: listConsignors
      tags: [Consignors]
      summary: Membaca daftar penitip
      description: Memuat status wallet tiap penitip, supaya pemilik toko tahu siapa yang belum bisa menerima dana.
      x-fr: [FR-23]
      x-priority: Kalau sempat
      x-roles: [store_owner]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Daftar penitip.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createConsignor
      tags: [Consignors]
      summary: Mendaftarkan penitip
      description: |
        Alamat wallet divalidasi formatnya dan berstatus `unverified` sampai penitip menandatanganinya
        lewat `POST /api/v1/wallet/link`. Email dipakai untuk mencocokkan akun Google penitip. Pembayaran
        memakai SOL, jadi tidak ada token account yang dibuat.
      x-fr: [FR-23]
      x-priority: Kalau sempat
      x-roles: [store_owner]
      x-error-codes: [CONSIGNOR_EMAIL_TAKEN, WALLET_ALREADY_LINKED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsignorCreate'
      responses:
        '201':
          description: Penitip terdaftar.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/consignors/{consignor_id}:
    parameters:
      - $ref: '#/components/parameters/ConsignorId'
    get:
      operationId: getConsignor
      tags: [Consignors]
      summary: Membaca satu penitip
      description: Penitip dari toko lain menjawab `404 NOT_FOUND`.
      x-fr: [FR-23]
      x-priority: Kalau sempat
      x-roles: [store_owner]
      responses:
        '200':
          description: Data penitip.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateConsignor
      tags: [Consignors]
      summary: Mengubah data penitip
      description: Wallet tidak bisa diubah lewat endpoint ini. Hanya penitip yang bisa menggantinya dengan tanda tangan.
      x-fr: [FR-23]
      x-priority: Kalau sempat
      x-roles: [store_owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsignorUpdate'
      responses:
        '200':
          description: Penitip diubah.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/preview:
    post:
      operationId: previewOrder
      tags: [Orders]
      summary: Menghitung rincian pembagian
      description: |
        Menghitung total, diskon, dan bagian tiap penerima tanpa menyimpan apa pun dan tanpa
        mereservasi stok. Kurs di sini belum dikunci, dan baru dikunci saat order dibuat.
      x-fr: [FR-02, FR-03, FR-04, FR-05, FR-06, FR-17, FR-28]
      x-priority: Wajib
      x-roles: [cashier, store_owner]
      x-error-codes:
        - INSUFFICIENT_STOCK
        - TOO_MANY_CONSIGNORS
        - DISCOUNT_TOO_LARGE
        - RECIPIENT_WALLET_MISSING
        - STORE_WALLET_NOT_LINKED
        - BELOW_RENT_MINIMUM
        - RATE_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
            examples:
              twoConsignors:
                summary: Dua barang dari dua penitip
                value:
                  lines:
                    - item_id: 11111111-1111-4111-8111-111111111111
                      quantity: 1
                    - item_id: 22222222-2222-4222-8222-222222222222
                      quantity: 2
      responses:
        '200':
          description: Rincian pembagian.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
