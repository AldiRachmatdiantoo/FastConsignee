        destination_wallet:
          allOf:
            - $ref: '#/components/schemas/SolanaAddress'
          description: Wallet pembayar di order asal.
        reference:
          $ref: '#/components/schemas/SolanaAddress'
        deduction:
          $ref: '#/components/schemas/RefundDeduction'
        reason:
          type:
