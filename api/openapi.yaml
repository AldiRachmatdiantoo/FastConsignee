      properties:
        order_line_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          maxLength: 500
    RefundDeduction:
      type: object
      required: [consignor, amount_idr]
      description: Bagian penitip yang akan dipotong setelah refund selesai.
      properties:
        consignor:
          $ref: '#/components/schemas/ConsignorRef'
        amount_idr:
          $ref: '#/components/schemas/AmountIdr'
    Refund:
      type: object
      required:
        - id
        - order_id
        - order_line_id
        - item_name
        - status
        - amount_idr
        - amount_lamports
        - source_wallet
        - destination_wallet
        - reference
        - deduction
        - reason
        - signature
        - explorer_url
        - expires_at
        - created_at
        - completed_at
