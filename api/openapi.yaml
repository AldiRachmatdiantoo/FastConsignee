            refunded_quantity:
              type: integer
              format: int32
              maximum: 1000
              minimum: 0
            certificate:
              description: Bernilai `null` kalau barang tidak menerbitkan sertifikat.
              oneOf:
                - $ref: '#/components/schemas/Certificate'
                - type: 'null'
    Payment:
      type: object
      required:
