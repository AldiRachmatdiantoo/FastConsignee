            - $ref: '#/components/schemas/ExplorerUrl'
            - type: 'null'
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Batas waktu menandatangani `transaction`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
